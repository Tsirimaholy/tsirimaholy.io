<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#334155" stroke-width="1" opacity=".42"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#020617" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#0f172a"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1080" cy="56" r="250" fill="#1d4ed8" opacity=".16"/>
  <circle cx="1030" cy="570" r="290" fill="#eab308" opacity=".08"/>

  <g transform="translate(70 58)">
    <rect width="150" height="42" rx="21" fill="#dbeafe"/>
    <circle cx="23" cy="21" r="8" fill="#2563eb"/>
    <text x="43" y="28" fill="#1e40af" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">DJANGO</text>
  </g>

  <text x="70" y="180" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" letter-spacing="-2">THE N+1 PROBLEM</text>
  <text x="70" y="238" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="27">Make database work explicit and predictable.</text>

  <g transform="translate(70 296)" filter="url(#shadow)">
    <rect width="470" height="184" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="32" y="43" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2">BEFORE</text>
    <text x="32" y="132" fill="#fca5a5" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="800">21</text>
    <text x="155" y="129" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="26">queries</text>
    <g transform="translate(318 43)">
      <rect width="116" height="98" rx="12" fill="#0f172a"/>
      <text x="58" y="43" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="16">1 +</text>
      <text x="58" y="70" text-anchor="middle" fill="#fca5a5" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">N × 2</text>
    </g>
  </g>

  <g transform="translate(572 368)">
    <path d="M0 20H70" fill="none" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>
    <path d="m55 5 17 15-17 15" fill="none" stroke="#facc15" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(680 296)" filter="url(#shadow)">
    <rect width="450" height="184" rx="18" fill="#fef08a" stroke="#facc15" stroke-width="3"/>
    <text x="32" y="43" fill="#854d0e" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2">AFTER</text>
    <text x="32" y="132" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="800">2</text>
    <text x="92" y="129" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="26">queries</text>
    <text x="418" y="83" text-anchor="end" fill="#1e3a8a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">select_related</text>
    <text x="418" y="114" text-anchor="end" fill="#1e3a8a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">prefetch_related</text>
  </g>

  <line x1="70" y1="548" x2="1130" y2="548" stroke="#334155" stroke-width="2"/>
  <text x="70" y="588" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600">tsirimaholy.com/blog</text>
  <text x="1130" y="588" text-anchor="end" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Tsirimaholy Razanapanala</text>
</svg>
